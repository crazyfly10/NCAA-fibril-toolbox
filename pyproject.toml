[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ncaaprotein"
version = "0.1.0"
description = "All-atom trajectories of a protein carrying a non-canonical amino acid (ff19SB / GAFF2 / OPC, GROMACS)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Harvey Fung"}]
dependencies = ["numpy", "networkx", "parmed", "MDAnalysis", "matplotlib"]

[project.scripts]
ncaaprotein = "ncaaprotein.cli:main"

[tool.setuptools]
packages = ["ncaaprotein", "ncaaprotein.stages"]

[tool.setuptools.package-data]
ncaaprotein = ["scripts/*.py", "mdp/*.mdp"]
